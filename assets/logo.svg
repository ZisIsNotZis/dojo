<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40" role="img" aria-label="dojo 道场">
  <!-- Two facing arcs: A ↔ B, the tension pair every dao must name.
       The dot between them is the one claim that survived the exchange. -->
  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
    <path d="M17.74 32.80 A13 13 0 0 1 17.74 7.20"/>
    <path d="M22.26 7.20 A13 13 0 0 1 22.26 32.80"/>
  </g>
  <circle cx="20" cy="20" r="2.4" fill="currentColor"/>
  <text x="42" y="27.6" fill="currentColor"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="0.6">dojo</text>
  <text x="92" y="26.6" fill="currentColor" opacity="0.7"
        font-family="'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
        font-size="15">道场</text>
</svg>
